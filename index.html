<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Roblox · player mugshot & ratings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a1c2b 0%, #232639 100%);
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: #2a2d3d;
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f0f0f5;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .player-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .mugshot-frame {
      flex-shrink: 0;
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #3f4257, #1e2033);
      border-radius: 2rem;
      padding: 5px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mugshot {
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      background: #191b28;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('https://tr.rbxcdn.com/30DAY-AvatarHeadshot-3B2E4CF0A5E1A5F2D3B6E5A2C0F1D8E9-Png/150/150/AvatarHeadshot/Webp/noFilter');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #2f3146;
      position: relative;
      overflow: hidden;
    }

    .mugshot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, #5f6480, #1b1e30);
      z-index: 0;
    }

    .mugshot::after {
      content: "👤";
      position: absolute;
      font-size: 3.2rem;
      opacity: 0.7;
      z-index: 1;
      color: white;
      text-shadow: 0 4px 8px black;
    }

    .mugshot img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      object-fit: cover;
      display: block;
    }

    .player-info {
      flex: 1;
      min-width: 180px;
    }

    .userid {
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a3a9cc;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      display: inline-block;
      margin-bottom: 0.5rem;
      backdrop-filter: blur(5px);
    }

    .username {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-shadow: 0 4px 10px rgba(0,0,0,0.6);
      letter-spacing: -0.3px;
      word-break: break-word;
    }

    .ratings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.9rem;
      margin: 2.2rem 0 1.8rem;
    }

    .rating-category {
      background: rgba(18, 20, 31, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 0.9rem 0.3rem 0.8rem;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 8px 14px rgba(0,0,0,0.5);
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .rating-category:hover {
      background: rgba(30, 33, 50, 0.8);
      transform: scale(1.02);
      border-color: rgba(255,255,255,0.2);
    }

    .category-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #b9c2e6;
      margin-bottom: 0.35rem;
    }

    .rating-value {
      font-size: 1.9rem;
      font-weight: 700;
      color: #ffd966;
      text-shadow: 0 0 12px #ffb34780;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 1px;
    }

    .rating-value .max {
      font-size: 0.9rem;
      font-weight: 500;
      color: #9a9fc7;
      margin-left: 2px;
      align-self: center;
    }

    .overall-section {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 2rem;
      padding: 1.2rem 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      margin-top: 0.6rem;
    }

    .overall-label {
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #cfd5ff;
    }

    .overall-rating {
      font-size: 3rem;
      font-weight: 800;
      color: #f3c969;
      display: flex;
      align-items: baseline;
      gap: 0.2rem;
      text-shadow: 0 0 20px #f0b34b;
      line-height: 1;
    }

    .overall-rating .max-overall {
      font-size: 1.3rem;
      font-weight: 500;
      color: #b9bedd;
      margin-left: 2px;
    }

    .footer-note {
      text-align: right;
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: #6e7290;
      letter-spacing: 0.4px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.5rem;
      }
      .username {
        font-size: 2rem;
      }
      .ratings-grid {
        gap: 0.5rem;
      }
      .rating-value {
        font-size: 1.5rem;
      }
    }

    .mugshot img.hidden-fallback {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="player-header">
      <div class="mugshot-frame">
        <div class="mugshot" id="mugshotContainer">
          <img id="playerHeadshot" src="" alt="Player Mugshot" style="display: none;" crossorigin="anonymous">
        </div>
      </div>
      <div class="player-info">
        <div class="userid" id="userIdDisplay">ID: 156</div>
        <div class="username" id="usernameDisplay">builderman</div>
      </div>
    </div>

    <div class="ratings-grid">
      <div class="rating-category">
        <div class="category-label">cc</div>
        <div class="rating-value"><span id="ccRating">0</span><span class="max">/10.0</span></div>
      </div>
      <div class="rating-category">
        <div class="category-label">cam</div>
        <div class="rating-value"><span id="camRating">0</span><span class="max">/10.0</span></div>
      </div>
      <div class="rating-category">
        <div class="category-label">cons</div>
        <div class="rating-value"><span id="consRating">0</span><span class="max">/10.0</span></div>
      </div>
      <div class="rating-category">
        <div class="category-label">bnc</div>
        <div class="rating-value"><span id="bncRating">0</span><span class="max">/10.0</span></div>
      </div>
    </div>

    <div class="overall-section">
      <span class="overall-label">OVERALL</span>
      <div class="overall-rating">
        <span id="overallRatingValue">0</span><span class="max-overall">/10.0</span>
      </div>
    </div>
    <div class="footer-note">
      ⚡ roblox player metrics
    </div>
  </div>

  <!-- Link to external player.js -->
  <script src="player.js"></script>
</body>
</html>
